name: Mettre a jour l'emploi du temps

# ---------------------------------------------------------------------------
# A REGLER : mets ici l'identifiant exact de ton groupe, celui que
#            `python celcat_edt.py --chercher "MI"` t'a affiche.
# ---------------------------------------------------------------------------
env:
  GROUPE: "REMPLACE-MOI"
  RES_TYPE: "103"
  DEBUT: "2026-09-01"
  FIN: "2027-07-31"

on:
  schedule:
    - cron: "0 4 * * *" # tous les jours vers 06h00 heure de Paris
  workflow_dispatch: # bouton "Run workflow" pour declencher a la main

permissions:
  contents: write

concurrency:
  group: edt
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet requests

      - name: Generer edt.ics
        run: |
          python celcat_edt.py \
            --groupe "$GROUPE" \
            --type "$RES_TYPE" \
            --debut "$DEBUT" \
            --fin "$FIN" \
            --sortie edt.ics

      - name: Verifier que le fichier n'est pas vide
        run: |
          n=$(grep -c '^BEGIN:VEVENT' edt.ics || true)
          echo "$n evenements dans edt.ics"
          if [ "$n" -lt 1 ]; then
            echo "::error::Aucun evenement genere - identifiant de groupe ou dates a verifier."
            exit 1
          fi

      - name: Publier seulement si les cours ont change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edt.ics
          # DTSTAMP change a chaque execution : on l'ignore pour decider s'il y a
          # un vrai changement d'emploi du temps.
          if git diff --cached --unified=0 -- edt.ics \
             | grep -E '^[+-][^+-]' | grep -qv 'DTSTAMP'; then
            git commit -m "EDT mis a jour ($(date -u +%F))"
            git push
            echo "Emploi du temps modifie et publie."
          else
            git reset --quiet
            echo "Aucun changement reel, rien a publier."
          fi
