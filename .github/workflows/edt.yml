name: Mettre a jour l'emploi du temps

# ---------------------------------------------------------------------------
# A REGLER : l'identifiant exact de ton groupe, celui que
#            `py -3 celcat_edt.py --chercher "MI"` affiche.
# ---------------------------------------------------------------------------
env:
  GROUPE: "MI501A"
  RES_TYPE: "103"
  DEBUT: "2026-09-01"
  FIN: "2027-07-31"

on:
  schedule:
    - cron: "0 4 * * *" # ~06h00 Paris, avant le resume matinal de 7h50
    - cron: "0 16 * * *" # ~18h00 Paris, rattrapage si CELCAT etait muet le matin
  workflow_dispatch: # bouton "Run workflow" pour declencher a la main
  push: # relance quand tu modifies la config ou le script
    paths:
      - ".github/workflows/edt.yml"
      - "celcat_edt.py"

permissions:
  contents: write

concurrency:
  group: edt
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet requests

      # Le script sort en code 2 quand CELCAT n'a pas repondu malgre ses
      # relances : panne passagere, on garde le fichier precedent sans echouer.
      - name: Generer edt.ics
        id: gen
        run: |
          set +e
          python celcat_edt.py \
            --groupe "$GROUPE" \
            --type "$RES_TYPE" \
            --debut "$DEBUT" \
            --fin "$FIN" \
            --sortie edt.ics
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning::CELCAT injoignable - edt.ics precedent conserve, nouvelle tentative au prochain passage."
            exit 0
          fi
          exit $code

      - name: Verifier que le fichier n'est pas vide
        if: steps.gen.outputs.code == '0'
        run: |
          n=$(grep -c '^BEGIN:VEVENT' edt.ics || true)
          echo "$n evenements dans edt.ics"
          if [ "$n" -lt 1 ]; then
            echo "::error::Aucun evenement genere - identifiant de groupe ou dates a verifier."
            exit 1
          fi

      - name: Publier seulement si les cours ont change
        if: steps.gen.outputs.code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edt.ics
          # DTSTAMP change a chaque execution : on l'ignore pour decider s'il y a
          # un vrai changement d'emploi du temps.
          if git diff --cached --unified=0 -- edt.ics \
             | grep -E '^[+-][^+-]' | grep -qv 'DTSTAMP'; then
            git commit -m "EDT mis a jour ($(date -u +%F))"
            git push
            echo "Emploi du temps modifie et publie."
          else
            git reset --quiet
            echo "Aucun changement reel, rien a publier."
          fi
